name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm run build
      - name: Verify real studio HTTP workflow
        env:
          AUTH_SECRET: studio-ci-only-secret-not-for-deployment
          HACKBUDDY_STUDIO_DB: /tmp/hackbuddy-ci.sqlite
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/hackbuddy-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node scripts/test-studio-http.mjs
